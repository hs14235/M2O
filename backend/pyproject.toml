[tool.ruff]
target-version = "py313"
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP", "BLE"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.File", "fastapi.Form", "fastapi.Query"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
# A stalled test prints every thread's stack instead of hanging silently.
faulthandler_timeout = 120
markers = [
    "fresh_schema: with --postgres, run on a schema of its own (the test changes alembic_version or the schema)",
]

[tool.pyright]
include = ["app"]
pythonVersion = "3.13"
