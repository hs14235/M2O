name: Verify application
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: meeting_tests
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: disposable_ci_password
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U test_user -d meeting_tests"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://test_user:disposable_ci_password@127.0.0.1:5432/meeting_tests
      APP_ENVIRONMENT: test
      PUBLIC_DEMO_MODE: "true"
      EMBED_PROVIDER: hash
      OLLAMA_MODEL: ""
      GITHUB_TOKEN: ""
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: python -m pip install -r requirements-dev.txt
        working-directory: backend
      - run: python -m ruff check app scripts tests migrations ../scripts
        working-directory: backend
      - run: python -m ruff format --check app scripts tests migrations ../scripts
        working-directory: backend
      - run: python -m pyright app --pythonpath python
        working-directory: backend
      - run: python -m scripts.migrate
        working-directory: backend
      - run: python -m alembic check
        working-directory: backend
      - run: python -m pytest -q --postgres
        working-directory: backend
      - run: python -m pip check
        working-directory: backend
      - run: python -m pip_audit -r constraints.txt --no-deps --disable-pip --progress-spinner off
        working-directory: backend
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --ignore-scripts --no-audit
        working-directory: frontend
      - run: npm run typecheck && npm test && npm run build
        working-directory: frontend
      - run: npm audit --audit-level=high
        working-directory: frontend
  containers-and-browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: python scripts/configure_local.py
      - run: docker compose config --quiet
      - run: docker compose up -d --build --wait web worker
      - run: python -m pip install -r requirements.txt
        working-directory: backend
      - run: python -m scripts.bootstrap_demo
        working-directory: backend
      - run: npm ci --ignore-scripts --no-audit
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: python scripts/run_e2e.py
      - run: docker compose logs --no-color --tail 100 api worker
        if: failure()
