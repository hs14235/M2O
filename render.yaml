# A bounded synthetic demo. Creating these resources still needs the owner's authorization.
services:
  - type: web
    name: m2o-synthetic-demo
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./Dockerfile.render
    dockerContext: .
    healthCheckPath: /readyz
    # Continuous deployment: main deploys only after its GitHub checks pass.
    autoDeployTrigger: checksPass
    envVars:
      # Direct (non-pooled) connection string of the dedicated Neon demo database, entered
      # privately in Render. Render allows one free Postgres per workspace, used by Trainline.
      - key: DATABASE_URL
        sync: false
      # The public origin comes from Render's RENDER_EXTERNAL_URL (see scripts/serve_demo.py).
      - key: PUBLIC_DEMO_MODE
        value: "true"
      - key: COOKIE_SECURE
        value: "true"
      - key: APP_ENVIRONMENT
        value: production
      - key: EMBED_PROVIDER
        value: hash
      - key: OLLAMA_MODEL
        value: ""
      - key: DB_POOL_SIZE
        value: "2"
      # One site-wide admission budget: Render publishes no inbound proxy ranges to trust.
      # Switch to trusted_proxy only after a hosted test proves CF-Connecting-IP is overwritten.
      - key: CLIENT_IDENTITY_MODE
        value: shared
      - key: SHARED_VISITOR_START_LIMIT
        value: "150"
